name: Publish stable installer release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package and publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release-assets
          python3 scripts/lib/package_release.py --output release-assets
          bash -n release-assets/install.sh
          bash release-assets/install.sh --help >/dev/null
          git archive --format=tar.gz --prefix=homelab/ HEAD >release-assets/homelab-source.tar.gz
          cd release-assets
          sha256sum install.sh homelab-source.tar.gz >SHA256SUMS
          gh release create "$RELEASE_TAG" install.sh homelab-source.tar.gz SHA256SUMS --verify-tag --notes "Download install.sh and SHA256SUMS, verify the installer, and follow docs/installation.md in the source archive."
