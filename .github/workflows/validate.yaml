name: Validate HomeLab
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt yamllint
      - name: Validate configuration and examples
        run: make validate
      - name: Safety regression tests
        run: make test
      - name: Shell validation
        run: |
          shellcheck install.sh scripts/*.sh
          shfmt -d -i 2 -ci install.sh scripts/*.sh
      - name: YAML and JSON validation
        run: |
          yamllint .
          python3 -m json.tool renovate.json >/dev/null
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
      - name: Documentation and installer entrypoints
        run: |
          python3 tests/check_docs.py
          bash install.sh --help >/dev/null
          bash install.sh --dry-run >/dev/null
          python3 scripts/lib/installer.py --help >/dev/null
