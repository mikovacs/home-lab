name: homelab-media
services:
  mount-guard:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 32m
    cpus: '0.1'
    image: python:3.13.11-alpine3.23
    command:
    - python
    - /guard.py
    volumes:
    - type: bind
      source: ${REPO_ROOT}/scripts/lib/mount_guard.py
      target: /guard.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT}
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid/${MEDIA_UUID}
      target: /expected-device
      read_only: true
      bind:
        create_host_path: false
    read_only: true
    cap_drop:
    - ALL
    network_mode: none
    user: ${PUID}:${PGID}
  plex:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: *id001
    logging: *id002
    mem_limit: ${PLEX_MEMORY:-2g}
    cpus: ${SERVICE_CPUS:-1.0}
    image: lscr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls334
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: '002'
      VERSION: docker
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/plex
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT}
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid/${MEDIA_UUID}
      target: /run/expected-media-device
      read_only: true
      bind:
        create_host_path: false
    networks:
    - proxy
    - media
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.plex.rule: Host(`plex.${DOMAIN}`)
      traefik.http.routers.plex.entrypoints: websecure
      traefik.http.routers.plex.tls: 'true'
      traefik.http.routers.plex.tls.certresolver: cloudflare
      traefik.http.routers.plex.middlewares: headers@file
      traefik.http.services.plex.loadbalancer.server.port: '32400'
    ports:
    - ${LAN_IP}:32400:32400
  radarr:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: *id001
    logging: *id002
    mem_limit: ${MEDIA_SERVICE_MEMORY:-512m}
    cpus: ${SERVICE_CPUS:-1.0}
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: '002'
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/radarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT}
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid/${MEDIA_UUID}
      target: /run/expected-media-device
      read_only: true
      bind:
        create_host_path: false
    networks:
    - proxy
    - media
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.radarr.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls: 'true'
      traefik.http.routers.radarr.tls.certresolver: cloudflare
      traefik.http.routers.radarr.middlewares: headers@file,sso@file
      traefik.http.services.radarr.loadbalancer.server.port: '7878'
  sonarr:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: *id001
    logging: *id002
    mem_limit: ${MEDIA_SERVICE_MEMORY:-512m}
    cpus: ${SERVICE_CPUS:-1.0}
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls6
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: '002'
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/sonarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT}
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid/${MEDIA_UUID}
      target: /run/expected-media-device
      read_only: true
      bind:
        create_host_path: false
    networks:
    - proxy
    - media
    depends_on:
      mount-guard:
        condition: service_completed_successfully
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.sonarr.rule: Host(`sonarr.${DOMAIN}`)
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls: 'true'
      traefik.http.routers.sonarr.tls.certresolver: cloudflare
      traefik.http.routers.sonarr.middlewares: headers@file,sso@file
      traefik.http.services.sonarr.loadbalancer.server.port: '8989'
