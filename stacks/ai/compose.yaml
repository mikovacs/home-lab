name: homelab-ai
services:
  ollama:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: ${AI_MEMORY:-4g}
    cpus: ${AI_CPUS:-2}
    image: ollama/ollama:0.40.18
    environment:
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
    - type: bind
      source: ${DATA_ROOT}/ai/models
      target: /root/.ollama
      read_only: false
      bind:
        create_host_path: false
    networks:
    - ai
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      data-guard:
        condition: service_completed_successfully
  webui:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt: *id001
    logging: *id002
    mem_limit: ${WEBUI_MEMORY:-1g}
    cpus: ${SERVICE_CPUS:-1.0}
    image: ghcr.io/open-webui/open-webui:v0.13.5
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SIGNUP: 'false'
      ENABLE_OPENAI_API: 'false'
    secrets:
    - webui-secret-key
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/webui
      target: /app/backend/data
      read_only: false
      bind:
        create_host_path: false
    networks:
    - proxy
    - ai
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.ai.rule: Host(`ai.${DOMAIN}`)
      traefik.http.routers.ai.entrypoints: websecure
      traefik.http.routers.ai.tls: 'true'
      traefik.http.routers.ai.tls.certresolver: cloudflare
      traefik.http.routers.ai.middlewares: headers@file,sso@file
      traefik.http.services.ai.loadbalancer.server.port: '8080'
    entrypoint:
    - /bin/sh
    - -ec
    - export WEBUI_SECRET_KEY="$$(cat /run/secrets/webui-secret-key)"; exec bash start.sh
    depends_on:
      data-guard:
        condition: service_completed_successfully
  data-guard:
    restart: 'no'
    init: true
    stop_grace_period: 45s
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 32m
    cpus: '0.1'
    image: python:3.13.11-alpine3.23
    command:
    - python
    - /guard.py
    volumes:
    - type: bind
      source: ${REPO_ROOT}/scripts/lib/mount_guard.py
      target: /guard.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DATA_ROOT}
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid/${DATA_UUID}
      target: /expected-device
      read_only: true
      bind:
        create_host_path: false
    read_only: true
    cap_drop:
    - ALL
    network_mode: none
    environment:
      GUARD_KIND: data
    user: ${PUID}:${PGID}
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
  ai:
    external: true
    name: ${AI_NETWORK}
secrets:
  webui-secret-key:
    file: ${SECRETS_ROOT}/webui-secret-key
