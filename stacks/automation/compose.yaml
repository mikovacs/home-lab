name: homelab-automation
services:
  postgres:
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: ${POSTGRES_MEMORY:-512m}
    cpus: ${SERVICE_CPUS:-1.0}
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/n8n-db-password
    secrets:
    - n8n-db-password
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/n8n-postgres
      target: /var/lib/postgresql/data
      read_only: false
      bind:
        create_host_path: false
    networks:
    - db
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U n8n -d n8n
      interval: 10s
      timeout: 5s
      retries: 10
  n8n:
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    security_opt: *id001
    logging: *id002
    mem_limit: ${N8N_MEMORY:-1g}
    cpus: ${SERVICE_CPUS:-1.0}
    image: n8nio/n8n:2.49.7
    user: 1000:1000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-db-password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n-encryption-key
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: '5678'
      N8N_WEBHOOK_URL: https://hooks.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: '1'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${N8N_HISTORY_HOURS:-168}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    secrets:
    - n8n-db-password
    - n8n-encryption-key
    volumes:
    - type: bind
      source: ${APPDATA_ROOT}/n8n
      target: /home/node/.n8n
      read_only: false
      bind:
        create_host_path: false
    networks:
    - db
    - proxy
    - ai
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.n8n.rule: Host(`n8n.${DOMAIN}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls: 'true'
      traefik.http.routers.n8n.tls.certresolver: cloudflare
      traefik.http.routers.n8n.middlewares: headers@file,sso@file
      traefik.http.services.n8n.loadbalancer.server.port: '5678'
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
  db:
    internal: true
  ai:
    external: true
    name: ${AI_NETWORK}
secrets:
  n8n-db-password:
    file: ${SECRETS_ROOT}/n8n-db-password
  n8n-encryption-key:
    file: ${SECRETS_ROOT}/n8n-encryption-key
