# Managed by HomeLab: wait for the exact published-port address before dockerd.
[Unit]
Wants=network-online.target
After=network-online.target
[Service]
ExecStartPre=/usr/bin/env HOMELAB_ENV_FILE=@HOST_ENV_FILE@ PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 @REPO_ROOT@/scripts/lib/homelab.py network-ready
TimeoutStartSec=@DOCKER_UNIT_TIMEOUT@
