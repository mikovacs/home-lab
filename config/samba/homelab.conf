# Review paths, group and firewall before integrating; never enable guest access.
[personal]
    path = /mnt/homelab-data/files
    browseable = yes
    read only = no
    guest ok = no
    valid users = @homelab-files
    create mask = 0660
    directory mask = 0770
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:resource = stream
[media-readonly]
    path = /mnt/plex-media/media
    browseable = yes
    read only = yes
    guest ok = no
    valid users = @homelab-files
